name: Gemini Portable Windows x64
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag; leave empty to build only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            New-Item -Type Directory bundle, downloads | Out-Null
            gh release download v26.11.9 -R XTLS/Xray-core -p 'Xray-windows-64.zip' -D downloads
            if ($LASTEXITCODE) { throw 'Xray download failed' }
            gh release download 157.0.8103.78-1.1 -R ungoogled-software/ungoogled-chromium-windows -p '*_windows_x64.zip' -D downloads
            if ($LASTEXITCODE) { throw 'Chromium download failed' }
            Expand-Archive downloads/Xray-windows-64.zip bundle/Core
            Expand-Archive (Get-Item downloads/*_windows_x64.zip).FullName downloads/chromium
            $chrome = Get-ChildItem downloads/chromium -Recurse -Filter chrome.exe | Select-Object -First 1
            if (!$chrome -or !(Test-Path bundle/Core/xray.exe)) { throw 'Missing bundled executables' }
            Copy-Item $chrome.Directory.FullName bundle/Browser -Recurse
            $framework = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
            & "$framework\csc.exe" /nologo /target:winexe /platform:x64 /out:bundle\Gemini.exe /r:System.Windows.Forms.dll /r:System.Web.dll /r:System.Web.Extensions.dll /r:Microsoft.VisualBasic.dll .\Gemini-Portable\Gemini.cs 2>&1 | Tee-Object -Variable compiler
            if ($LASTEXITCODE -or !(Test-Path bundle/Gemini.exe)) { throw "Compilation failed: $compiler" }
            Copy-Item Gemini-Portable/README.md bundle/README.md
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Portable-Win10-x64
          path: bundle/
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gemini-Portable-Win10-x64
          path: bundle
      - name: Publish portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^gemini-portable-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd bundle && zip -qr ../Gemini-Portable-Win10-x64.zip .)
          unzip -tq Gemini-Portable-Win10-x64.zip
          gh release create "$TAG" Gemini-Portable-Win10-x64.zip --repo "$REPO" --target "$SHA" --title "Gemini Portable $TAG" --notes 'Windows 10 x64. Extract the entire archive and launch Gemini.exe. Chromium and Xray are included. No installation required. See README.md for subscription compatibility.'
